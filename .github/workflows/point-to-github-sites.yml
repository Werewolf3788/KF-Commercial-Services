name: Point the portfolio at the GitHub site
on: push
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point the Clay County entry at werewolf3788.github.io/SMLC
        run: |
          python3 - <<'PYCODE'
          s = open('index.html', encoding='utf-8').read()
          if 'supportmylocalcommunity.com' not in s:
              raise SystemExit(0)
          s = s.replace('data-src="https://www.supportmylocalcommunity.com/"', 'data-src="https://werewolf3788.github.io/SMLC/"')
          s = s.replace('<a href="https://www.supportmylocalcommunity.com/" target="_blank" rel="noopener">Open the site</a>', '<a href="https://werewolf3788.github.io/SMLC/" target="_blank" rel="noopener">Open the site</a>')
          open('index.html', 'w', encoding='utf-8').write(s)
          print('remaining links to the domain:', s.count('supportmylocalcommunity.com'))
          PYCODE
          if git diff --quiet; then echo "Nothing to change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Point the Clay County portfolio entry at the GitHub Pages site"
          git push