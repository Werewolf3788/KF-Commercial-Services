name: Portfolio cleanup
on: push
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Quick Links and refresh the PlayStation card
        run: |
          python3 - <<'PY'
          s = open('index.html', encoding='utf-8').read()
          if 'Quick Links' not in s:
              raise SystemExit(0)
          tab = '        <button type="button" class="tab" data-src="https://werewolf3788.github.io/Quick-Links/" data-name="Quick Links">Quick Links</button>\n'
          s = s.replace(tab, '')
          card = '      <article class="card">\n        <h4>Quick Links</h4>\n        <p>A dashboard that keeps everything I build in one place, grouped and clickable, so I can jump straight to any project or its GitHub repo.</p>\n        <div class="tags"><span class="tag">Dashboard</span><span class="tag">Project index</span><span class="tag">Shortcut</span></div>\n        <div class="links">\n          <button type="button" class="pv" data-src="https://werewolf3788.github.io/Quick-Links/" data-name="Quick Links">Preview here</button>\n          <a href="https://werewolf3788.github.io/Quick-Links/" target="_blank" rel="noopener">Open the site</a>\n        </div>\n      </article>\n'
          s = s.replace(card, '')
          old = '<p>A companion for Way of the Hunter 2: record harvest inspection screen, live herd watchlist, need-zone clusters, species life cycles and despawn rules, with a PlayStation hub alongside it.</p>'
          new = '<p>A PlayStation hub for the games I play: one door into every game progress tracker I have built, plus the Way of the Hunter 2 field companion with harvest logs, live herd watchlist, need-zone clusters, species life cycles and despawn rules.</p>'
          s = s.replace(old, new)
          open('index.html', 'w', encoding='utf-8').write(s)
          PY
          if git diff --quiet; then echo "Nothing to change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Quick Links from the portfolio and update the PlayStation hub card"
          git push